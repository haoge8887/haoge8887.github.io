<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>测一测：看你和历史哪位名人比较像？</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(ellipse at top,#2a1a3e 0%,#1a1a2e 40%,#0a0a14 100%);
    min-height:100vh; color:#e8e8e8; padding:16px;
  }
  .container {
    max-width:680px; margin:0 auto;
    background:rgba(255,255,255,0.04);
    border-radius:24px; padding:24px 20px;
    backdrop-filter:blur(12px);
    border:1px solid rgba(240,194,127,0.15);
    box-shadow:0 24px 80px rgba(0,0,0,0.6);
  }
  h1 {
    font-size:23px; text-align:center; margin-bottom:22px;
    background:linear-gradient(90deg,#f0c27f,#fc5c7d,#f0c27f);
    background-size:200% auto;
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    animation:shine 4s linear infinite;
    line-height:1.5;
  }
  @keyframes shine { to { background-position:200% center; } }

  .progress-bar { height:6px; background:rgba(255,255,255,0.08); border-radius:3px; margin-bottom:22px; overflow:hidden; }
  .progress-fill { height:100%; width:0%; background:linear-gradient(90deg,#f0c27f,#fc5c7d); transition:width .3s; }

  .scene-tag {
    display:inline-block; font-size:11px; padding:3px 10px;
    background:rgba(240,194,127,0.12); color:#f0c27f;
    border-radius:20px; margin-bottom:12px; letter-spacing:1px;
  }
  .question { font-size:17px; line-height:1.65; margin-bottom:18px; font-weight:600; }
  .options { display:flex; flex-direction:column; gap:11px; }
  .option {
    padding:14px 16px; background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1); border-radius:14px;
    cursor:pointer; transition:all .2s; font-size:14.5px; line-height:1.5;
  }
  .option:hover { background:rgba(255,255,255,0.1); border-color:rgba(240,194,127,0.4); transform:translateX(3px); }
  .option.selected {
    background:rgba(240,194,127,0.22); border-color:#f0c27f;
    transform:translateX(6px);
  }

  .nav-row {
    display:grid; grid-template-columns:1fr 1fr; gap:10px;
    margin-top:18px;
  }
  .nav-btn {
    padding:13px; border-radius:12px; font-size:14px;
    font-weight:700; cursor:pointer; letter-spacing:1px;
    border:none; transition:all .2s;
  }
  .nav-btn:disabled { opacity:.3; cursor:not-allowed; }
  .nav-prev {
    background:transparent;
    border:1px solid rgba(255,255,255,0.18);
    color:#9aa5b1;
  }
  .nav-prev:hover:not(:disabled) { border-color:#f0c27f; color:#f0c27f; }
  .nav-next {
    background:linear-gradient(90deg,#f0c27f,#fc5c7d);
    color:#1a1a2e;
  }
  .nav-next:hover:not(:disabled) { transform:translateY(-2px); }

  .btn {
    display:block; width:100%; padding:16px; margin-top:20px;
    background:linear-gradient(90deg,#f0c27f,#fc5c7d);
    border:none; border-radius:14px; color:#1a1a2e;
    font-size:16px; font-weight:800; cursor:pointer;
    transition:transform .2s; letter-spacing:1px;
  }
  .btn:hover { transform:translateY(-2px); }

  .result { display:none; }
  .result.show { display:block; animation:fadeIn .6s ease; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(20px);} to{opacity:1;transform:translateY(0);} }

  .hero-card {
    position:relative; border-radius:20px; overflow:hidden;
    background:
      radial-gradient(ellipse at top,rgba(240,194,127,0.18),transparent 60%),
      linear-gradient(135deg,#2a1f12 0%,#3d2a15 50%,#1f1420 100%);
    border:1px solid rgba(240,194,127,0.5);
    box-shadow:
      0 0 0 1px rgba(240,194,127,0.08) inset,
      0 12px 40px rgba(240,194,127,0.12),
      0 20px 60px rgba(0,0,0,0.5);
    margin-bottom:14px;
    padding:26px 22px 24px;
    text-align:center;
  }
  .hero-card::before {
    content:""; position:absolute; top:-50%; left:-50%;
    width:200%; height:200%;
    background:conic-gradient(from 0deg,transparent,rgba(240,194,127,0.1),transparent 30%);
    animation:rotate 10s linear infinite; z-index:0;
  }
  @keyframes rotate { to { transform:rotate(360deg); } }

  .corner {
    position:absolute; width:16px; height:16px;
    border-color:#f0c27f; z-index:2; opacity:.7;
  }
  .corner.tl { top:10px; left:10px; border-top:1.5px solid; border-left:1.5px solid; border-top-left-radius:4px; }
  .corner.tr { top:10px; right:10px; border-top:1.5px solid; border-right:1.5px solid; border-top-right-radius:4px; }
  .corner.bl { bottom:10px; left:10px; border-bottom:1.5px solid; border-left:1.5px solid; border-bottom-left-radius:4px; }
  .corner.br { bottom:10px; right:10px; border-bottom:1.5px solid; border-right:1.5px solid; border-bottom-right-radius:4px; }

  .hero-inner { position:relative; z-index:1; }

  .hero-name {
    font-size:38px; font-weight:900; letter-spacing:4px;
    background:linear-gradient(90deg,#f0c27f,#ffe4a8,#fc5c7d);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    margin-bottom:6px;
    text-shadow:0 0 30px rgba(240,194,127,0.3);
  }
  .hero-tag {
    font-size:13px; color:#f0c27f; letter-spacing:2px;
    margin-bottom:12px;
  }
  .hero-divider {
    display:flex; align-items:center; justify-content:center;
    gap:8px; margin:12px 0;
  }
  .hero-divider span {
    height:1px; width:40px;
    background:linear-gradient(90deg,transparent,#f0c27f);
  }
  .hero-divider span:last-child {
    background:linear-gradient(90deg,#f0c27f,transparent);
  }
  .hero-divider i {
    width:5px; height:5px; border-radius:50%;
    background:#f0c27f; display:block;
    box-shadow:0 0 8px rgba(240,194,127,0.8);
  }
  .hero-arche { font-size:12.5px; color:#c9b896; letter-spacing:1.5px; }

  .radar-wrap {
    background:rgba(255,255,255,0.03); border-radius:18px;
    padding:16px; margin-bottom:14px;
    border:1px solid rgba(240,194,127,0.15); text-align:center;
  }
  .radar-title { font-size:12.5px; color:#f0c27f; letter-spacing:2px; margin-bottom:8px; }
  canvas { max-width:100%; }

  .card {
    background:rgba(255,255,255,0.04); border-radius:16px;
    padding:18px 20px; margin-bottom:12px;
    border-left:3px solid #f0c27f;
  }
  .card h3 {
    font-size:12px; color:#f0c27f; margin-bottom:10px;
    letter-spacing:2px; font-weight:600;
  }
  .card p {
    font-size:14.5px; line-height:1.85; color:#d0d6dc;
    margin-bottom:8px;
  }
  .card p:last-child { margin-bottom:0; }
  .card p strong { color:#ffe4a8; font-weight:700; }

  .card-gold { border-left-color:#f0c27f; background:rgba(240,194,127,0.07); }
  .card-pink { border-left-color:#fc5c7d; background:rgba(252,92,125,0.06); }
  .card-blue { border-left-color:#6fb1fc; background:rgba(111,177,252,0.06); }
  .card-green { border-left-color:#6fdc8c; background:rgba(111,220,140,0.06); }

  .two-col {
    display:grid; grid-template-columns:1fr 1fr; gap:10px;
    margin-bottom:12px;
  }
  @media (max-width:480px) {
    .two-col { grid-template-columns:1fr; }
  }

  .action-row {
    display:grid; grid-template-columns:1fr 1fr; gap:10px;
    margin-top:16px;
  }
  @media (max-width:480px) {
    .action-row { grid-template-columns:1fr; }
  }
  .action-btn {
    padding:14px; border-radius:14px; font-size:14px;
    font-weight:700; cursor:pointer; letter-spacing:1px;
    border:none; transition:transform .2s;
  }
  .action-btn:hover { transform:translateY(-2px); }
  .action-share {
    background:linear-gradient(90deg,#f0c27f,#fc5c7d);
    color:#1a1a2e;
  }
  .action-restart {
    background:transparent;
    border:1px solid rgba(255,255,255,0.18);
    color:#9aa5b1;
  }
  .action-restart:hover { border-color:#f0c27f; color:#f0c27f; }

  .hidden { display:none !important; }

  .share-modal {
    position:fixed; inset:0; z-index:999;
    background:rgba(0,0,0,0.85);
    display:none; align-items:center; justify-content:center;
    padding:20px;
    overflow-y:auto;
  }
  .share-modal.show { display:flex; }
  .share-inner { max-width:360px; width:100%; text-align:center; margin:auto; }
  .share-inner img {
    width:100%; border-radius:16px;
    box-shadow:0 20px 60px rgba(0,0,0,0.8);
  }
  .share-tip {
    font-size:13px; color:#9aa5b1; margin-top:14px; line-height:1.6;
  }
  .share-close {
    margin-top:14px; padding:12px 28px; border-radius:12px;
    background:linear-gradient(90deg,#f0c27f,#fc5c7d);
    border:none; color:#1a1a2e; font-weight:800;
    font-size:14px; cursor:pointer; letter-spacing:1px;
  }
</style>
</head>
<body>
<div class="container">
  <div id="intro">
    <h1>测一测：看你和历史哪位名人比较像？</h1>
    <button class="btn" onclick="startTest()">开始测试</button>
  </div>

  <div id="quiz" class="hidden">
    <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
    <div class="scene-tag" id="sceneTag"></div>
    <div class="question" id="questionText"></div>
    <div class="options" id="options"></div>
    <div class="nav-row">
      <button class="nav-btn nav-prev" id="prevBtn" onclick="prevQuestion()">上一题</button>
      <button class="nav-btn nav-next" id="nextBtn" onclick="nextQuestionManual()">下一题</button>
    </div>
  </div>

  <div id="result" class="result"></div>
</div>

<div class="share-modal" id="shareModal">
  <div class="share-inner">
    <img id="shareImg" alt="结果卡片">
    <div class="share-tip">长按图片保存到相册<br>或截图后发小红书</div>
    <button class="share-close" onclick="closeShare()">关闭</button>
  </div>
</div>

<script>

/* ================= 题库：44 题，11 个场景组（已删除人生终局） ================= */
const SCENE_GROUPS = [
  { scene:"楚汉相争", questions:[

/* ================= 抽题：从 11 组抽 5 组，共 20 题 ================= */
function buildQuestions() {
  const groups = shuffle(SCENE_GROUPS).slice(0, 5);
  let all = [];
  groups.forEach(g => {
    g.questions.forEach(q => {
      all.push({ scene: g.scene, q: q.q, opts: q.opts });
    });
  });
  return all;
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const radarLabels = ["谋略","决断","行动","才情","通透","仁厚","隐忍","奇思"];

/* ================= 状态 ================= */
let current = 0;
let answers = [];
let scores = {A:0,B:0,C:0,D:0,E:0,F:0,G:0,H:0};
let lastResult = null;
let locked = false;

function startTest() {
  questions = buildQuestions();
  current = 0;
  answers = [];
  scores = {A:0,B:0,C:0,D:0,E:0,F:0,G:0,H:0};
  locked = false;
  document.getElementById('intro').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  renderQuestion();
}

function renderQuestion() {
  locked = false;
  const q = questions[current];
  document.getElementById('sceneTag').textContent = "【" + q.scene + "】";
  document.getElementById('questionText').textContent = `${current+1}. ${q.q}`;
  const optsEl = document.getElementById('options');
  optsEl.innerHTML = '';
  q.opts.forEach((opt,i)=>{
    const div = document.createElement('div');
    div.className = 'option';
    if (answers[current] === i) div.classList.add('selected');
    div.textContent = opt.t;
    div.onclick = ()=>selectOption(i,div);
    optsEl.appendChild(div);
  });
  document.getElementById('progress').style.width = `${(current/questions.length)*100}%`;

  document.getElementById('prevBtn').disabled = current === 0;
  const nextBtn = document.getElementById('nextBtn');
  // 下一题按钮：始终可点（不看是否有答案）
  nextBtn.disabled = false;
  if (current === questions.length - 1) {
    nextBtn.textContent = '查看结果';
  } else {
    nextBtn.textContent = '下一题';
  }
}

function selectOption(index, el) {
  if (locked) return;
  locked = true;
  document.querySelectorAll('.option').forEach(o=>o.classList.remove('selected'));
  el.classList.add('selected');
  answers[current] = index;

  setTimeout(() => {
    locked = false;
    if (current < questions.length - 1) {
      current++;
      renderQuestion();
    } else {
      // 最后一题，停留在本题，让用户点「查看结果」
      document.getElementById('nextBtn').textContent = '查看结果';
    }
  }, 280);
}

function prevQuestion() {
  if (current > 0) {
    current--;
    renderQuestion();
  }
}

function nextQuestionManual() {
  if (current < questions.length - 1) {
    current++;
    renderQuestion();
  } else {
    calcScores();
    showResult();
  }
}

function calcScores() {
  scores = {A:0,B:0,C:0,D:0,E:0,F:0,G:0,H:0};
  for (let i = 0; i < questions.length; i++) {
    if (answers[i] === undefined) continue;
    const opt = questions[i].opts[answers[i]];
    for (const k in opt.s) scores[k] += opt.s[k];
  }
}

/* ================= 雷达图 ================= */
function drawRadar(canvas, values) {
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const size = 260;
  canvas.width = size * dpr;
  canvas.height = size * dpr;
  canvas.style.width = size + 'px';
  canvas.style.height = size + 'px';
  ctx.scale(dpr, dpr);

  const cx = size/2, cy = size/2, R = 88;
  const n = values.length;
  const maxV = Math.max(...values, 1);

  ctx.strokeStyle = 'rgba(240,194,127,0.18)';
  ctx.lineWidth = 1;
  for (let ring = 1; ring <= 4; ring++) {
    ctx.beginPath();
    for (let i = 0; i <= n; i++) {
      const ang = -Math.PI/2 + (i%n) * 2*Math.PI/n;
      const r = R * ring/4;
      const x = cx + r*Math.cos(ang);
      const y = cy + r*Math.sin(ang);
      i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.stroke();
  }
  for (let i = 0; i < n; i++) {
    const ang = -Math.PI/2 + i*2*Math.PI/n;
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.lineTo(cx+R*Math.cos(ang), cy+R*Math.sin(ang));
    ctx.stroke();
  }
  ctx.beginPath();
  for (let i = 0; i <= n; i++) {
    const idx = i % n;
    const ang = -Math.PI/2 + idx*2*Math.PI/n;
    const r = R * (values[idx]/maxV);
    const x = cx + r*Math.cos(ang);
    const y = cy + r*Math.sin(ang);
    i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  }
  ctx.closePath();
  const grad = ctx.createLinearGradient(0,0,size,size);
  grad.addColorStop(0,'rgba(240,194,127,0.45)');
  grad.addColorStop(1,'rgba(252,92,125,0.45)');
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.strokeStyle = '#f0c27f';
  ctx.lineWidth = 2;
  ctx.stroke();

  for (let i = 0; i < n; i++) {
    const ang = -Math.PI/2 + i*2*Math.PI/n;
    const r = R * (values[i]/maxV);
    const x = cx + r*Math.cos(ang);
    const y = cy + r*Math.sin(ang);
    ctx.beginPath();
    ctx.arc(x,y,3,0,Math.PI*2);
    ctx.fillStyle = '#fc5c7d';
    ctx.fill();
  }
  ctx.fillStyle = '#c9b896';
  ctx.font = '12px -apple-system,sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (let i = 0; i < n; i++) {
    const ang = -Math.PI/2 + i*2*Math.PI/n;
    const x = cx + (R+20)*Math.cos(ang);
    const y = cy + (R+20)*Math.sin(ang);
    ctx.fillText(radarLabels[i], x, y);
  }
}

    ],
    D:[

      { name:"苏轼", match:q=>q[2]===3 },
      { name:"陶渊明", match:q=>q[18]===3 },
      { name:"王羲之", match:q=>q[6]===0 },
      { name:"唐伯虎", match:q=>q[16]===0 },
      { name:"李清照", match:()=>true }
    ],
    E:[
      { name:"老子", match:q=>q[9]===3 },
      { name:"孔子", match:q=>q[12]===0 },
      { name:"庄子", match:q=>q[12]===1 },
      { name:"王阳明", match:q=>q[12]===2 },
      { name:"曾国藩", match:q=>q[8]===2 },
      { name:"弘一法师", match:q=>q[20]===3 },
      { name:"诸葛亮", match:()=>true }
    ],
    F:[
      { name:"刘备", match:q=>q[13]===3 },
      { name:"刘秀", match:q=>q[21]===2 },
      { name:"宋江", match:q=>q[14]===0 },
      { name:"孟尝君", match:q=>q[3]===2 },
      { name:"信陵君", match:q=>q[16]===2 },
      { name:"周公旦", match:q=>q[1]===2 },
      { name:"范仲淹", match:()=>true }
    ],
    G:[
      { name:"勾践", match:q=>q[9]===0 },
      { name:"司马懿", match:q=>q[0]===3 },
      { name:"朱棣", match:q=>q[21]===2 },
      { name:"皇太极", match:q=>q[11]===2 },
      { name:"范蠡", match:q=>q[13]===2 },
      { name:"虞舜", match:q=>q[14]===0 },
      { name:"晋文公", match:()=>true }
    ],
    H:[
      { name:"鬼谷子", match:q=>q[3]===3 },
      { name:"鲁班", match:q=>q[16]===3 },
      { name:"张衡", match:q=>q[12]===3 },
      { name:"华佗", match:q=>q[14]===3 },
      { name:"袁天罡", match:q=>q[21]===3 },
      { name:"李淳风", match:q=>q[21]===0 },
      { name:"东方朔", match:()=>true }
    ]
  };
  const list = map[topKey] || [];
  for (const p of list) {
    if (p.match(answers)) return p.name;
  }
  return list[list.length-1]?.name || "曹操";
}

/* ================= 结果 ================= */
function showResult() {
  document.getElementById('quiz').classList.add('hidden');
  const resultEl = document.getElementById('result');
  resultEl.classList.add('show');

  let topKey = 'A', topScore = -1;
  for (const k in scores) if (scores[k] > topScore) { topScore = scores[k]; topKey = k; }

  const personName = pickPerson(topKey, answers);
  const person = PEOPLE[personName];
  const archeName = archetypes[topKey].name;

  const rawVals = ['A','B','C','D','E','F','G','H'].map(k=>scores[k]);
  const maxRaw = Math.max(...rawVals, 1);
  const radarVals = rawVals.map(v => Math.round(v/maxRaw*100));

  lastResult = { personName, person, archeName, radarVals };

  resultEl.innerHTML = `
    <div class="hero-card">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
      <div class="hero-inner">
        <div class="hero-name">${personName}</div>
        <div class="hero-tag">${person.tag}</div>
        <div class="hero-divider"><span></span><i></i><span></span></div>
        <div class="hero-arche">人格原型 · ${archeName}</div>
      </div>
    </div>

    <div class="radar-wrap">
      <div class="radar-title">你的 8 维特质雷达</div>
      <canvas id="radarCanvas"></canvas>
    </div>

    <div class="card card-gold">
      <h3>性格匹配</h3>
      <p>${person.desc}</p>
    </div>

    <div class="card card-blue">
      <h3>你的天赋</h3>
      <p>${person.gift}</p>
    </div>

    <div class="two-col">
      <div class="card card-pink">
        <h3>盲区</h3>
        <p>${person.blind}</p>
      </div>
      <div class="card card-green">
        <h3>成功路径</h3>

      <button class="action-btn action-restart" onclick="restart()">再测一次</button>
    </div>
  `;

  drawRadar(document.getElementById('radarCanvas'), radarVals);
}

/* ================= 分享卡片（二维码右下角） ================= */
function generateShare() {
  if (!lastResult) return;
  const { personName, person, archeName, radarVals } = lastResult;

  const W = 750, H = 1350;
  const canvas = document.createElement('canvas');
  const dpr = 2;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const bgGrad = ctx.createLinearGradient(0,0,0,H);
  bgGrad.addColorStop(0,'#1a1a2e');
  bgGrad.addColorStop(0.5,'#16213e');
  bgGrad.addColorStop(1,'#0a0a14');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0,0,W,H);

  const glow = ctx.createRadialGradient(W/2, 200, 0, W/2, 200, 500);
  glow.addColorStop(0,'rgba(240,194,127,0.25)');
  glow.addColorStop(1,'rgba(240,194,127,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0,0,W,600);

  ctx.fillStyle = '#9aa5b1';
  ctx.font = '22px -apple-system,"PingFang SC",sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('你和历史哪位名人比较像？', W/2, 90);

  const nameGrad = ctx.createLinearGradient(W/2-200,0,W/2+200,0);
  nameGrad.addColorStop(0,'#f0c27f');
  nameGrad.addColorStop(0.5,'#ffe4a8');
  nameGrad.addColorStop(1,'#fc5c7d');
  ctx.fillStyle = nameGrad;
  ctx.font = 'bold 88px -apple-system,"PingFang SC",sans-serif';
  ctx.fillText(personName, W/2, 200);

  ctx.fillStyle = '#f0c27f';
  ctx.font = '24px -apple-system,"PingFang SC",sans-serif';
  ctx.fillText(person.tag, W/2, 250);

  ctx.strokeStyle = 'rgba(240,194,127,0.4)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(W/2-160, 280);
  ctx.lineTo(W/2+160, 280);
  ctx.stroke();

  ctx.fillStyle = '#c9b896';
  ctx.font = '22px -apple-system,"PingFang SC",sans-serif';
  ctx.fillText('人格原型 · ' + archeName, W/2, 320);

  ctx.fillStyle = '#f0c27f';
  ctx.font = '20px -apple-system,"PingFang SC",sans-serif';
  ctx.fillText('8 维特质雷达', W/2, 375);

  drawRadarOnCanvas(ctx, W/2, 540, 150, radarVals);

  const lines = [
    { title:'性格匹配', text: stripTags(person.desc).slice(0, 60) + '…' },
    { title:'你的天赋', text: stripTags(person.gift).slice(0, 60) + '…' },
    { title:'成功路径', text: stripTags(person.advice).slice(0, 80) + '…' }
  ];

  let y = 780;
  lines.forEach(line => {
    ctx.fillStyle = '#f0c27f';
    ctx.font = 'bold 22px -apple-system,"PingFang SC",sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(line.title, 80, y);

    ctx.fillStyle = '#d0d6dc';
    ctx.font = '20px -apple-system,"PingFang SC",sans-serif';
    const maxWidth = W - 160;
    const words = line.text.split('');
    let curLine = '';
    let lineY = y + 34;
    for (const ch of words) {
      const test = curLine + ch;
      if (ctx.measureText(test).width > maxWidth) {
        ctx.fillText(curLine, 80, lineY);
        curLine = ch;
        lineY += 30;
      } else {
        curLine = test;
      }
    }
    if (curLine) ctx.fillText(curLine, 80, lineY);
    y = lineY + 50;
  });

  /* ===== 二维码区域：右下角 ===== */
  const qrSize = 130;
  const qrMargin = 30;                    // 距右下角边距
  const qrX = W - qrSize - qrMargin;      // 右下角 x
  const qrY = H - qrSize - qrMargin - 30; // 右下角 y（再上移一点给文字）

  // 二维码白底
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.roundRect(qrX - 8, qrY - 8, qrSize + 16, qrSize + 16, 10);
  ctx.fill();

  if (QR_IMG_URL) {
    const qrImg = new Image();
    qrImg.crossOrigin = 'anonymous';
    qrImg.onload = () => {
      ctx.drawImage(qrImg, qrX, qrY, qrSize, qrSize);
      drawShareFooter(ctx, W, H);
      finishShare(canvas);
    };
    qrImg.onerror = () => {
      drawQRPlaceholder(ctx, qrX, qrY, qrSize);
      drawShareFooter(ctx, W, H);
      finishShare(canvas);
    };
    qrImg.src = QR_IMG_URL;
    return;
  } else {
    drawQRPlaceholder(ctx, qrX, qrY, qrSize);
  }

  drawShareFooter(ctx, W, H);
  finishShare(canvas);
}

function drawShareFooter(ctx, W, H) {
  // 二维码右侧提示文字（右下角区域）
  const qrSize = 130;
  const qrMargin = 30;
  const qrX = W - qrSize - qrMargin;
  const qrY = H - qrSize - qrMargin - 30;

  ctx.textAlign = 'right';
  ctx.fillStyle = '#f0c27f';
  ctx.font = 'bold 20px -apple-system,"PingFang SC",sans-serif';
  ctx.fillText(QR_LINK_TEXT, qrX - 15, qrY + 50);

  ctx.fillStyle = '#9aa5b1';
  ctx.font = '16px -apple-system,"PingFang SC",sans-serif';
  ctx.fillText('看完整版解读', qrX - 15, qrY + 78);
  ctx.fillText('解锁 56 位历史名人', qrX - 15, qrY + 100);

  // 底部水印（左下角）
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(240,194,127,0.55)';
  ctx.font = '16px -apple-system,"PingFang SC",sans-serif';
  ctx.fillText('· 测一测你和历史哪位名人比较像 ·', 30, H - 30);
}

function drawQRPlaceholder(ctx, x, y, size) {
  ctx.fillStyle = '#333';
  ctx.fillRect(x, y, size, size);
  ctx.fillStyle = '#888';
  ctx.font = '14px -apple-system,sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('二维码', x + size/2, y + size/2);
  ctx.textBaseline = 'alphabetic';
}

function finishShare(canvas) {
  const dataUrl = canvas.toDataURL('image/png');
  document.getElementById('shareImg').src = dataUrl;
  document.getElementById('shareModal').classList.add('show');
}

function stripTags(html) { return html.replace(/<[^>]+>/g, ''); }

function drawRadarOnCanvas(ctx, cx, cy, R, values) {
  const n = values.length;
  const maxV = Math.max(...values, 1);

  ctx.strokeStyle = 'rgba(240,194,127,0.25)';
  ctx.lineWidth = 1;
  for (let ring = 1; ring <= 4; ring++) {
    ctx.beginPath();
    for (let i = 0; i <= n; i++) {
      const ang = -Math.PI/2 + (i%n) * 2*Math.PI/n;
      const r = R * ring/4;
      const x = cx + r*Math.cos(ang);
      const y = cy + r*Math.sin(ang);
      i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.stroke();
  }
  for (let i = 0; i < n; i++) {
    const ang = -Math.PI/2 + i*2*Math.PI/n;
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.lineTo(cx+R*Math.cos(ang), cy+R*Math.sin(ang));
    ctx.stroke();
  }
  ctx.beginPath();
  for (let i = 0; i <= n; i++) {
    const idx = i % n;
    const ang = -Math.PI/2 + idx*2*Math.PI/n;
    const r = R * (values[idx]/maxV);
    const x = cx + r*Math.cos(ang);
    const y = cy + r*Math.sin(ang);
    i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  }
  ctx.closePath();
  const grad = ctx.createLinearGradient(cx-R,cy-R,cx+R,cy+R);
  grad.addColorStop(0,'rgba(240,194,127,0.55)');
  grad.addColorStop(1,'rgba(252,92,125,0.55)');
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.strokeStyle = '#f0c27f';
  ctx.lineWidth = 2;
  ctx.stroke();

  for (let i = 0; i < n; i++) {
    const ang = -Math.PI/2 + i*2*Math.PI/n;
    const r = R * (values[i]/maxV);
    const x = cx + r*Math.cos(ang);
    const y = cy + r*Math.sin(ang);
    ctx.beginPath();
    ctx.arc(x,y,4,0,Math.PI*2);
    ctx.fillStyle = '#fc5c7d';
    ctx.fill();
  }

  ctx.fillStyle = '#c9b896';
  ctx.font = '18px -apple-system,"PingFang SC",sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (let i = 0; i < n; i++) {
    const ang = -Math.PI/2 + i*2*Math.PI/n;
    const x = cx + (R+30)*Math.cos(ang);
    const y = cy + (R+30)*Math.sin(ang);
    ctx.fillText(radarLabels[i], x, y);
  }
}

function closeShare() {
  document.getElementById('shareModal').classList.remove('show');
}

function restart() {
  current = 0; answers = [];
  scores = {A:0,B:0,C:0,D:0,E:0,F:0,G:0,H:0};
  document.getElementById('result').classList.remove('show');
  document.getElementById('intro').classList.remove('hidden');
}
</script>
